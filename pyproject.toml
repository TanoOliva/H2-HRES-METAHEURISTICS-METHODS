[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h2-hres"
version = "0.3.0"
description = "Replicacion y extension discreta del sistema WPEB (Li et al. 2024) con metaheuristicas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luciano Andres Oliva Jara" }]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "requests>=2.31",
    "PyYAML>=6.0",
    "tqdm>=4.65",
    "scipy>=1.11",
]

[project.optional-dependencies]
fast = ["numba>=0.58"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
h2hres = "h2_hres.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
